[project]
name = "pac-man"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcade>=3.3.3",
    "mazegenerator",
    "pathlib>=1.0.1",
    "pydantic>=2.13.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pacman"]

[tool.uv.sources]
mazegenerator = { path = "libs/mazegenerator-2.1.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
